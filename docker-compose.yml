version: '3.9'

services:
  app:
    build: .
    container_name: aggregatorib_app
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: aggregator_ib
      DB_SSLMODE: disable
      DB_TIMEZONE: UTC
      JWT_SECRET: super-secret-key-change-me
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: aggregatorib_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aggregator_ib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aggregator_ib"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
